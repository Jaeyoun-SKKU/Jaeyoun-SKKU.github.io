<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publications | Ryu Lab</title>
<link rel="stylesheet" href="style.css">
<style>
.pub-year-heading { margin: 32px 0 8px; color: #2f3a45; font-size: 1.25em; border-bottom: 2px solid #2f6fb0; padding-bottom: 6px; }
.pub-year-heading:first-of-type { margin-top: 20px; }
.pub-list { list-style: none; padding: 0; margin: 0; }
.pub-item { padding: 16px 0; border-bottom: 1px solid #e2e8f0; }
.pub-item:last-child { border-bottom: none; }
.pub-title { font-weight: 600; color: #2f3a45; margin: 0 0 6px; }
.pub-authors { color: #4a5563; margin: 0 0 4px; font-size: 0.95em; }
.pub-journal { color: #6b7784; margin: 0; font-size: 0.9em; }
.pub-journal a { color: #2f6fb0; text-decoration: none; }
.pub-journal a:hover { text-decoration: underline; }
.pub-note { color: #8a97a3; font-size: 0.82em; margin: 4px 0 0; }
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>Ryu Lab</h1>
    <p class="subtitle">Next Generation ImmunoGenomics</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="pi.html">PI</a>
      <div class="dropdown">
        <a href="members.html" class="dropdown-toggle">Members</a>
        <div class="dropdown-menu">
          <a href="members.html#postdoc">Post-Doc</a>
          <a href="members.html#students">Students</a>
          <a href="members.html#interns">Interns</a>
        </div>
      </div>
      <a href="publications.html">Publications</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <h2>Publications</h2>

    <div id="pub-container"></div>

    <p class="pub-note">* denotes corresponding author</p>

  </div>
</section>

<footer>
  <div class="container">
    <p>&copy; 2026 Ryu Lab, Sungkyunkwan University. All rights reserved.</p>
  </div>
</footer>

<script>
function boldify(text) {
  return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

fetch('_data/publications.json')
  .then(res => res.json())
  .then(data => {
    const byYear = {};
    data.publications.forEach(p => {
      if (!byYear[p.year]) byYear[p.year] = [];
      byYear[p.year].push(p);
    });

    const years = Object.keys(byYear).sort((a, b) => b - a);
    let html = '';

    years.forEach(year => {
      html += `<h3 class="pub-year-heading">${year}</h3><ul class="pub-list">`;
      byYear[year].forEach(p => {
        html += `
          <li class="pub-item">
            <p class="pub-title">${p.title}</p>
            <p class="pub-authors">${boldify(p.authors)}</p>
            <p class="pub-journal">${p.journal} doi: <a href="https://doi.org/${p.doi}" target="_blank">${p.doi}</a>. PMID: <a href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank">${p.pmid}</a></p>
          </li>`;
      });
      html += '</ul>';
    });

    document.getElementById('pub-container').innerHTML = html;
  })
  .catch(err => console.error('Failed to load publications.json', err));
</script>

</body>
</html>
