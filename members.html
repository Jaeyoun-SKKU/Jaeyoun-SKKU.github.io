<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members | Ryu Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container">
    <h1>Ryu Lab</h1>
    <p class="subtitle">Next Generation ImmunoGenomics</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="pi.html">PI</a>
      <div class="dropdown">
        <a href="members.html" class="dropdown-toggle">Members</a>
        <div class="dropdown-menu">
          <a href="members.html#postdoc">Post-Doc</a>
          <a href="members.html#students">Students</a>
          <a href="members.html#interns">Interns</a>
        </div>
      </div>
      <a href="publications.html">Publications</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <h2>Lab Members</h2>

    <h3 id="postdoc" class="member-group-title">Post-Doc</h3>
    <div id="group-postdoc"></div>

    <h3 id="students" class="member-group-title">Students</h3>
    <div id="group-students"></div>

    <h3 id="interns" class="member-group-title">Interns</h3>
    <div id="group-interns"></div>

  </div>
</section>

<footer>
  <div class="container">
    <p>&copy; 2026 Ryu Lab, Sungkyunkwan University. All rights reserved.</p>
  </div>
</footer>

<script>
fetch('_data/members.json')
  .then(res => res.json())
  .then(data => {
    const groups = { postdoc: [], students: [], interns: [] };
    data.members.forEach(m => {
      if (groups[m.group]) groups[m.group].push(m);
    });

    function renderMember(m) {
      let notesHtml = '';
      if (m.notes && m.notes.length) {
        notesHtml = '<ul class="member-notes">' +
          m.notes.map(n => `<li>${n}</li>`).join('') +
          '</ul>';
      } else {
        notesHtml = '<ul class="member-notes"></ul>';
      }

      let roleHtml = '';
      if (m.role_past) {
        roleHtml += `<p class="member-role-past">${m.role_past}</p>`;
        roleHtml += `<p class="member-role-current"><strong>${m.role_current}</strong></p>`;
      } else {
        roleHtml += `<p class="member-role"><strong>${m.role_current}</strong></p>`;
      }

      return `
        <div class="member-profile">
          <div class="member-photo-wrap"><img src="${m.photo}" alt="${m.name_kr}" class="member-photo"></div>
          <div class="member-info">
            <p class="member-name-kr">${m.name_kr}</p>
            ${roleHtml}
            ${notesHtml}
          </div>
        </div>`;
    }

    document.getElementById('group-postdoc').innerHTML = groups.postdoc.map(renderMember).join('');
    document.getElementById('group-students').innerHTML = groups.students.map(renderMember).join('');
    document.getElementById('group-interns').innerHTML = groups.interns.map(renderMember).join('');
  })
  .catch(err => console.error('Failed to load members.json', err));
</script>

</body>
</html>
