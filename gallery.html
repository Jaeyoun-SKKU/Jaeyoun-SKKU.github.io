<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Ryu Lab</title>
<link rel="stylesheet" href="style.css">
<style>
.gallery-wide {
  width: 92vw;
  max-width: 1500px;
  margin: 0 auto;
}
.album-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 32px;
  width: 100%;
  margin-top: 24px;
}
.album-card {
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  text-align: left;
  font-family: inherit;
}
.album-thumb {
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  background: linear-gradient(135deg, #eef3f8 0%, #dfe8f1 100%);
  border: 1px dashed #b9c6d3;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8a97a3;
  font-size: 1.05em;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(30, 41, 59, 0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.album-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.album-card:hover .album-thumb {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(30, 41, 59, 0.16);
}
.album-title {
  margin: 14px 2px 2px;
  font-weight: 600;
  color: #2f3a45;
  font-size: 1.1em;
}
.album-date {
  margin: 2px 2px 0;
  font-size: 0.9em;
  color: #8a97a3;
}

.lightbox-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20, 26, 33, 0.75);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.lightbox-overlay.open {
  display: flex;
}
.lightbox-box {
  width: 100%;
  max-width: 640px;
}
.lightbox-title {
  color: #fff;
  text-align: center;
  margin-bottom: 4px;
  font-weight: 600;
}
.lightbox-date {
  color: #c7d0d9;
  text-align: center;
  margin-bottom: 16px;
  font-size: 0.9em;
}
.carousel {
  position: relative;
  width: 100%;
}
.carousel-track {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border-radius: 16px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
}
.carousel-slide {
  position: absolute;
  inset: 0;
  display: flex;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #eef3f8 0%, #dfe8f1 100%);
  box-sizing: border-box;
  align-items: center;
  justify-content: center;
  color: #8a97a3;
  font-size: 1.05em;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
.carousel-slide.active {
  opacity: 1;
  pointer-events: auto;
}
.carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.carousel-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.95);
  border: none;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  font-size: 1.1em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #3b4756;
  user-select: none;
  box-shadow: 0 4px 14px rgba(30, 41, 59, 0.18);
  transition: transform 0.2s ease, background 0.2s ease;
  z-index: 2;
}
.carousel-arrow:hover {
  background: #ffffff;
  transform: translateY(-50%) scale(1.08);
}
.carousel-arrow.prev { left: 14px; }
.carousel-arrow.next { right: 14px; }
.carousel-dots {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
}
.carousel-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #6b7784;
  cursor: pointer;
  border: none;
  padding: 0;
  transition: all 0.25s ease;
}
.carousel-dot.active {
  background: #ffffff;
  width: 24px;
  border-radius: 5px;
}
.lightbox-close {
  position: absolute;
  top: 24px;
  right: 32px;
  background: none;
  border: none;
  color: #fff;
  font-size: 1.8em;
  cursor: pointer;
  line-height: 1;
}
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>Ryu Lab</h1>
    <p class="subtitle">Next Generation ImmunoGenomics</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="pi.html">PI</a>
      <div class="dropdown">
        <a href="members.html" class="dropdown-toggle">Members</a>
        <div class="dropdown-menu">
          <a href="members.html#postdoc">Post-Doc</a>
          <a href="members.html#students">Students</a>
          <a href="members.html#interns">Interns</a>
        </div>
      </div>

<section class="section">
  <div class="gallery-wide">
    <h2>Gallery</h2>

    <div class="album-grid">
      <button class="album-card" data-album="0">
        <div class="album-thumb"><span>Photo coming soon</span></div>
        <p class="album-title">Album Title</p>
        <p class="album-date">2026.00.00</p>
      </button>
      <button class="album-card" data-album="1">
        <div class="album-thumb"><span>Photo coming soon</span></div>
        <p class="album-title">Album Title</p>
        <p class="album-date">2026.00.00</p>
      </button>
      <button class="album-card" data-album="2">
        <div class="album-thumb"><span>Photo coming soon</span></div>
        <p class="album-title">Album Title</p>
        <p class="album-date">2026.00.00</p>
      </button>
      <button class="album-card" data-album="3">
        <div class="album-thumb"><span>Photo coming soon</span></div>
        <p class="album-title">Album Title</p>
        <p class="album-date">2026.00.00</p>
      </button>
      <button class="album-card" data-album="4">
        <div class="album-thumb"><span>Photo coming soon</span></div>
        <p class="album-title">Album Title</p>
        <p class="album-date">2026.00.00</p>
      </button>
      <button class="album-card" data-album="5">
        <div class="album-thumb"><span>Photo coming soon</span></div>
        <p class="album-title">Album Title</p>
        <p class="album-date">2026.00.00</p>
      </button>
    </div>

  </div>
</section>

<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
  <div class="lightbox-box">
    <p class="lightbox-title" id="lightboxTitle"></p>
    <p class="lightbox-date" id="lightboxDate"></p>
    <div class="carousel">
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-arrow prev" onclick="moveSlide(-1)" aria-label="Previous photo">&#10094;</button>
      <button class="carousel-arrow next" onclick="moveSlide(1)" aria-label="Next photo">&#10095;</button>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <p>&copy; 2026 Ryu Lab, Sungkyunkwan University. All rights reserved.</p>
  </div>
</footer>

<script>
(function() {
  var albums = [
    { title: 'Album Title', date: '2026.00.00', photos: ['Photo coming soon'] },
    { title: 'Album Title', date: '2026.00.00', photos: ['Photo coming soon'] },
    { title: 'Album Title', date: '2026.00.00', photos: ['Photo coming soon'] },
    { title: 'Album Title', date: '2026.00.00', photos: ['Photo coming soon'] },
    { title: 'Album Title', date: '2026.00.00', photos: ['Photo coming soon'] },
    { title: 'Album Title', date: '2026.00.00', photos: ['Photo coming soon'] }
  ];

  var current = 0;
  var activeAlbum = null;

  var overlay = document.getElementById('lightbox');
  var track = document.getElementById('carouselTrack');
  var dotsWrap = document.getElementById('carouselDots');
  var titleEl = document.getElementById('lightboxTitle');
  var dateEl = document.getElementById('lightboxDate');

  document.querySelectorAll('.album-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var idx = parseInt(card.getAttribute('data-album'), 10);
      openAlbum(idx);
    });
  });

  function openAlbum(idx) {
    activeAlbum = albums[idx];
    current = 0;
    titleEl.textContent = activeAlbum.title;
    dateEl.textContent = activeAlbum.date;

    track.innerHTML = '';
    dotsWrap.innerHTML = '';

    activeAlbum.photos.forEach(function(photo, i) {
      var slide = document.createElement('div');
      slide.className = 'carousel-slide' + (i === 0 ? ' active' : '');
      slide.innerHTML = '<span>' + photo + '</span>';
      track.appendChild(slide);

      var dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', function() { goToSlide(i); });
      dotsWrap.appendChild(dot);
    });

    overlay.classList.add('open');
  }

  window.closeLightbox = function() {
    overlay.classList.remove('open');
  };

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeLightbox();
  });

  function update() {
    var slides = track.querySelectorAll('.carousel-slide');
    var dots = dotsWrap.querySelectorAll('.carousel-dot');
    slides.forEach(function(s, i) { s.classList.toggle('active', i === current); });
    dots.forEach(function(d, i) { d.classList.toggle('active', i === current); });
  }

  window.moveSlide = function(dir) {
    var len = activeAlbum.photos.length;
    current = (current + dir + len) % len;
    update();
  };

  window.goToSlide = function(i) {
    current = i;
    update();
  };

  document.addEventListener('keydown', function(e) {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') moveSlide(-1);
    if (e.key === 'ArrowRight') moveSlide(1);
  });
})();
</script>

</body>
</html>
